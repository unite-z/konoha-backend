# Back-end Áreas Verdes (por ahora, MOD-06 «Reportes, indicadores e IA»).
# Se reutiliza el mismo backend/.env (importado como properties) con los mismos nombres de variables.
server:
  port: ${PORT:8000}
spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: areas-verdes-backend
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
    serialization:
      write-dates-as-timestamps: false
springdoc:
  api-docs:
    path: /api/schema
  swagger-ui:
    path: /api/docs
mod06:
  data-source: ${DATA_SOURCE:mock}
  mock-data-dir: ${MOCK_DATA_DIR:../mock-data}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:}
logging:
  level:
    pe.edu.pucp.areasverdes.mod06: INFO
