# Back-end Áreas Verdes: MOD-05 «Atenciones tercerizadas» y MOD-06 «Reportes, indicadores e IA».
# Se reutiliza el mismo backend/.env (importado como properties) con los mismos nombres de variables.
server:
  port: ${PORT:8000}
  forward-headers-strategy: framework
spring:
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: areas-verdes-backend
  datasource:
    url: ${MOD05_DB_URL:jdbc:postgresql://localhost:5432/areas_verdes_mod05}
    username: ${MOD05_DB_USER:areas_verdes}
    password: ${MOD05_DB_PASSWORD:}
  servlet:
    multipart:
      max-file-size: ${MOD05_MAX_FILE_SIZE:20MB}
      max-request-size: ${MOD05_MAX_REQUEST_SIZE:100MB}
  jackson:
    # Claves JSON en snake_case en toda la API (ADR 0005). Los campos Java siguen en camelCase.
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
      fail-on-null-for-primitives: true
      accept-float-as-int: false
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      # Solo /api/health, para el healthcheck de Docker y el smoke test del despliegue.
      base-path: /api
      discovery:
        enabled: false
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
springdoc:
  api-docs:
    path: /api/schema
  swagger-ui:
    path: /api/docs
core:
  seguridad:
    # Supuestos ACC-S4 a ACC-S6 del equipo, pendientes de la contraparte (RNF-011).
    intentos-maximos: ${CORE_INTENTOS_MAXIMOS:5}
    minutos-bloqueo: ${CORE_MINUTOS_BLOQUEO:15}
    minutos-inactividad: ${CORE_MINUTOS_INACTIVIDAD:30}
    dias-sesion-persistente: ${CORE_DIAS_SESION_PERSISTENTE:30}
    # CU-MOD01-007 dice 60 y HU-MOD01-008 dice 75: pendiente de decidir.
    dias-sin-uso: ${CORE_DIAS_SIN_USO:60}
    # false solo en local sin HTTPS.
    cookie-segura: ${CORE_COOKIE_SEGURA:true}
mod05:
  archivos: ${MOD05_ARCHIVOS_DIR:./private-media}
  max-archivo-bytes: ${MOD05_MAX_ARCHIVO_BYTES:20971520}
  mock-data: ${MOD05_MOCK_DATA:mock-data}
mod06:
  data-source: ${DATA_SOURCE:mock}
  mock-data-dir: ${MOCK_DATA_DIR:mock-data}
  gemini-api-key: ${GEMINI_API_KEY:}
  gemini-model: ${GEMINI_MODEL:}
  gemini-thinking-level: ${GEMINI_THINKING_LEVEL:low}
  ia:
    fuente-reportes: ${IA_FUENTE_REPORTES:mod05}
logging:
  level:
    pe.edu.pucp.areasverdes.mod06: INFO
