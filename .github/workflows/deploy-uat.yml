name: deploy-uat

# Cada fusión en main publica la imagen konoha-api:<sha> en GHCR y la despliega en UAT.
# El registro de qué corre en UAT queda en la pestaña Environments de este repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Los despliegues se encolan; nunca se cancelan a mitad.
concurrency:
  group: deploy-uat
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  imagen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      imagen: ${{ steps.nombre.outputs.imagen }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/konoha-api:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.nombre.outputs.imagen }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    needs: imagen
    # Mientras no exista la EC2, el despliegue se salta y main no sale en rojo.
    if: vars.DESPLIEGUE_ACTIVO == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: uat
      url: ${{ vars.URL_UAT }}
    steps:
      - name: clave SSH
        env:
          SSH_KEY_DEPLOY: ${{ secrets.SSH_KEY_DEPLOY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY_DEPLOY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: desplegar en uat
        env:
          HOST: ${{ vars.SSH_HOST }}
        run: |
          if ! ssh -o ConnectTimeout=15 "deploy@$HOST" true; then
            echo "::error::La EC2 no responde por SSH. ¿Está arrancado el Learner Lab? Relanza este workflow cuando lo esté."
            exit 1
          fi
          ssh "deploy@$HOST" "/opt/konoha/infra/scripts/deploy.sh uat api $GITHUB_SHA"

  avisar:
    needs: [imagen, desplegar]
    if: failure()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [[ -n "$DEPLOY_WEBHOOK_URL" ]] || { echo "Sin DEPLOY_WEBHOOK_URL: no se avisa."; exit 0; }
          jq -n --arg c "deploy-uat de konoha-api ha fallado ($GITHUB_SHA). $ENLACE" '{content: $c}' \
            | curl -fsS -m 10 -H 'Content-Type: application/json' -d @- "$DEPLOY_WEBHOOK_URL"
