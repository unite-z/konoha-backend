name: tamano-pr

# Avisa en el PR si pasa del tamaño recomendado. Solo comenta: no forma parte de ci-ok y nunca bloquea la fusión.
# La revisión del contenido la hace Copilot con .github/copilot-instructions.md y .github/instructions/.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: tamano-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  tamano:
    if: github.event.pull_request.draft == false && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: tamaño del PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          LIMITE: ${{ vars.LIMITE_LINEAS_PR || '400' }}
        run: python3 .github/scripts/comprobar-tamano.py
